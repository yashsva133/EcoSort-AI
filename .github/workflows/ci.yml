name: EcoSort AI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system OpenCV dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke Test Model Loading & Heuristic Engine
      run: |
        python -c "
        import cv2, numpy as np, onnxruntime as ort
        print('ONNX Providers:', ort.get_available_providers())
        seg = ort.InferenceSession('waste_segmentation_model.onnx', providers=['CPUExecutionProvider'])
        cls = ort.InferenceSession('waste_classification_model.onnx', providers=['CPUExecutionProvider'])
        print('✓ Segmentation input shape:', seg.get_inputs()[0].shape)
        print('✓ Classification input shape:', cls.get_inputs()[0].shape)
        print('✓ Models successfully validated!')
        "
